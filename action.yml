name: 'Run Julia test items'
description: 'Run tests that are based on the test item framework'
inputs:
  juliaup-channel:
    required: false
  results-path:
    type: string
    required: false
  env:
    required: false
    default: ""
  filter:
    required: false
    default: ""
  profile-name:
    required: false
    default: ""
  testitem-timeout:
    required: false
    default: "1200"
runs:
  using: "composite"
  steps:
    - name: Setup Julia and compute cache keys
      id: setup
      shell: bash
      run: |
        juliaup add release
        echo "JULIA_RELEASE_VERSION=$(julia +release -v)" >> $GITHUB_OUTPUT
        echo "JULIA_VERSION=$(julia -v)" >> $GITHUB_OUTPUT
        echo "MANIFEST_HASH=$(sha256sum "$GITHUB_ACTION_PATH/Manifest.toml" | cut -d ' ' -f1)" >> $GITHUB_OUTPUT
    - uses: actions/cache/restore@v4
      id: cache-project
      with:
        path: ${{ runner.tool_cache }}/julia-run-testitems-depot
        key: julia-run-testitems-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.JULIA_RELEASE_VERSION }}-${{ steps.setup.outputs.JULIA_VERSION }}-${{ steps.setup.outputs.MANIFEST_HASH }}
        restore-keys: |
          julia-run-testitems-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.JULIA_RELEASE_VERSION }}-${{ steps.setup.outputs.JULIA_VERSION }}-
    - name: Install and precompile
      if: steps.cache-project.outputs.cache-hit != 'true'
      run: julia +release -e 'import Pkg; Pkg.instantiate()'
      shell: bash
      env:
        JULIA_PROJECT: ${{ github.action_path }}
        JULIA_DEPOT_PATH: ${{ runner.tool_cache }}/julia-run-testitems-depot
    - uses: actions/cache/save@v4
      if: steps.cache-project.outputs.cache-hit != 'true'
      with:
        path: ${{ runner.tool_cache }}/julia-run-testitems-depot
        key: julia-run-testitems-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.JULIA_RELEASE_VERSION }}-${{ steps.setup.outputs.JULIA_VERSION }}-${{ steps.setup.outputs.MANIFEST_HASH }}
    - name: Run test items
      run: |
        $jargs = @('.', '--progress', 'log', '--no-fail-on-detection-error')
        $channel = if ($env:TEST_JULIAUP_CHANNEL) { $env:TEST_JULIAUP_CHANNEL } else { 'release' }
        $jargs += @('--juliaup-channel', $channel)
        $jargs += @('--timeout', $env:TEST_TIMEOUT)
        if ($env:TEST_ENV) { $jargs += @('--env-json', $env:TEST_ENV) }
        if ($env:TEST_FILTER) { $jargs += @('--filter', $env:TEST_FILTER) }
        if ($env:TEST_PROFILE_NAME) { $jargs += @('--profile-name', $env:TEST_PROFILE_NAME) }
        if ($env:RESULTS_PATH) { $jargs += @('--results-json', $env:RESULTS_PATH) }
        if ($env:RUNNER_DEBUG -eq '1') { $jargs += '--debug' }
        julia +release --project=$env:GITHUB_ACTION_PATH -m TestItemApp @jargs
        exit $LASTEXITCODE
      shell: pwsh
      env:
        JULIA_DEPOT_PATH: ${{ runner.tool_cache }}/julia-run-testitems-depot
        TEST_JULIAUP_CHANNEL: ${{ inputs.juliaup-channel }}
        TEST_ENV: ${{ inputs.env }}
        TEST_FILTER: ${{ inputs.filter }}
        TEST_TIMEOUT: ${{ inputs.testitem-timeout }}
        TEST_PROFILE_NAME: ${{ inputs.profile-name }}
        RESULTS_PATH: ${{ inputs.results-path }}
