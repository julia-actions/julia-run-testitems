name: 'Run Julia test items'
description: 'Run @testitem-based Julia tests via the juliati CLI (TestItemApp.jl)'
inputs:
  test-path:
    description: 'Directory to search for test items (relative to the workspace)'
    required: false
    default: '.'
  juliaup-channel:
    description: 'Juliaup channel used for the test worker processes (default: release)'
    required: false
    default: ''
  results-path:
    description: >-
      Path to write the test-run results JSON (TestItemControllers.Results format).
      This is mainly the integration point for julia-actions/julia-report-ci-results;
      leave unset when not aggregating results across jobs.
    required: false
    default: ''
  env:
    description: >-
      Environment variables for the test processes, as a JSON object string,
      e.g. '{"FOO": "bar"}' (not KEY=VALUE lines).
    required: false
    default: ''
  filter:
    description: >-
      Julia expression over `name`, `tags`, `filename` and `package_name`; only test
      items for which it evaluates to true are run, e.g. ':ci in tags'.
    required: false
    default: ''
  profile-name:
    description: 'Profile name recorded in the results JSON (default: Default)'
    required: false
    default: ''
  testitem-timeout:
    description: 'Per-test-item timeout in seconds'
    required: false
    default: '1200'
  coverage:
    description: 'Run the test processes in coverage mode'
    required: false
    default: 'false'
  max-workers:
    description: 'Maximum number of parallel test processes (default: the juliati default)'
    required: false
    default: ''
  check-bounds:
    description: >-
      --check-bounds mode for the test processes: 'yes' (default) forces bounds checks
      everywhere, matching Pkg.test semantics; 'auto' respects @inbounds annotations
      and reuses existing precompile caches.
    required: false
    default: 'yes'
  annotations:
    description: 'Emit GitHub error annotations for failed test items'
    required: false
    default: 'true'
  junit-path:
    description: >-
      Path to write the test-run results as JUnit XML. Most CI test reporters consume this
      format; the results JSON written by results-path is richer, but far less portable.
    required: false
    default: ''
  coverage-lcov-path:
    description: >-
      Path to write the merged coverage of the run in LCOV format, for Codecov, Coveralls
      and similar. Implies coverage.
    required: false
    default: ''
  output-mode:
    description: >-
      Which captured test-item output to echo into the job log: 'issues' (default, only
      failing items), 'all', or 'none'. Captured output is always present in the results
      JSON regardless of this setting.
    required: false
    default: ''
  threads:
    description: "Value for the test processes' --threads (e.g. '4', 'auto', '2,1')"
    required: false
    default: ''
  gc-between-testitems:
    description: >-
      Run a full GC between test items: 'true', 'false', or empty for the juliati default
      (on when more than one test process is used).
    required: false
    default: ''
  memory-threshold:
    description: >-
      Recycle a test process once system memory use exceeds this fraction (0-1). Off by
      default. Experimental.
    required: false
    default: ''
  test-log-level:
    description: >-
      Minimum log level for the code under test -- your package and the test item bodies:
      'debug', 'info' (the juliati default), 'warn' or 'error'. This is a separate axis from
      GitHub's debug-logging checkbox, which controls the test infrastructure's own
      diagnostics; see the README. Empty leaves the juliati default.
    required: false
    default: ''
  schedule:
    description: >-
      How test items are distributed over test processes: 'duration' (the juliati default,
      ordering by measured duration, past failures and warm setups) or 'contiguous' for the
      previous chunk-by-position behaviour. Set this to 'contiguous' to rule the scheduler
      out when diagnosing a run.
    required: false
    default: ''
outputs:
  results-path:
    description: 'Path of the results JSON that was written (empty if none was written)'
    value: ${{ steps.run.outputs.results-path }}
  junit-path:
    description: 'Path of the JUnit XML that was written (empty if none was written)'
    value: ${{ steps.run.outputs.junit-path }}
runs:
  using: "composite"
  steps:
    - name: Install host Julia
      shell: bash
      run: juliaup add release
    - name: Install and precompile
      run: julia +release -e 'import Pkg; Pkg.instantiate()'
      shell: bash
      env:
        JULIA_PROJECT: ${{ github.action_path }}
    - name: Run test items
      id: run
      run: |
        $resultsFile = $env:RESULTS_PATH
        if (-not $resultsFile -and $env:ANNOTATIONS -eq 'true') {
          $resultsFile = Join-Path $env:RUNNER_TEMP 'testitem-results.json'
        }
        $testPath = if ($env:TEST_PATH) { $env:TEST_PATH } else { '.' }
        $jargs = @($testPath, '--progress', 'log', '--no-fail-on-detection-error')
        $channel = if ($env:TEST_JULIAUP_CHANNEL) { $env:TEST_JULIAUP_CHANNEL } else { 'release' }
        $jargs += @('--juliaup-channel', $channel)
        if ($env:TEST_TIMEOUT) { $jargs += @('--timeout', $env:TEST_TIMEOUT) }
        if ($env:TEST_ENV) { $jargs += @('--env-json', $env:TEST_ENV) }
        if ($env:TEST_FILTER) { $jargs += @('--filter', $env:TEST_FILTER) }
        if ($env:TEST_PROFILE_NAME) { $jargs += @('--profile-name', $env:TEST_PROFILE_NAME) }
        if ($resultsFile) { $jargs += @('--results-json', $resultsFile) }
        if ($env:TEST_COVERAGE -eq 'true') { $jargs += '--coverage' }
        if ($env:TEST_COVERAGE_LCOV) { $jargs += @('--coverage-lcov', $env:TEST_COVERAGE_LCOV) }
        if ($env:TEST_JUNIT_PATH) { $jargs += @('--junit-xml', $env:TEST_JUNIT_PATH) }
        if ($env:TEST_OUTPUT_MODE) { $jargs += @('--output', $env:TEST_OUTPUT_MODE) }
        if ($env:TEST_MAX_WORKERS) { $jargs += @('--max-workers', $env:TEST_MAX_WORKERS) }
        if ($env:TEST_THREADS) { $jargs += @('--threads', $env:TEST_THREADS) }
        if ($env:TEST_MEMORY_THRESHOLD) { $jargs += @('--memory-threshold', $env:TEST_MEMORY_THRESHOLD) }
        if ($env:TEST_SCHEDULE) { $jargs += @('--schedule', $env:TEST_SCHEDULE) }
        if ($env:TEST_LOG_LEVEL) { $jargs += @('--log-level', $env:TEST_LOG_LEVEL) }
        # Tri-state: unset leaves the juliati default (on when more than one test process).
        if ($env:TEST_GC_BETWEEN -eq 'true') { $jargs += '--gc-between-testitems' }
        elseif ($env:TEST_GC_BETWEEN -eq 'false') { $jargs += '--no-gc-between-testitems' }
        if ($env:TEST_CHECK_BOUNDS) { $jargs += @('--check-bounds', $env:TEST_CHECK_BOUNDS) }
        # GitHub's debug-logging checkbox turns on the *infrastructure's* diagnostics only,
        # matching what ACTIONS_STEP_DEBUG is documented to mean. Raising the log level of the
        # code under test is the separate, explicit `test-log-level` input above.
        if ($env:RUNNER_DEBUG -eq '1') { $jargs += '--debug' }
        julia +release --project=$env:GITHUB_ACTION_PATH -m TestItemApp @jargs
        "exit-code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
        "results-path=$resultsFile" >> $env:GITHUB_OUTPUT
        "junit-path=$env:TEST_JUNIT_PATH" >> $env:GITHUB_OUTPUT
      shell: pwsh
      env:
        TEST_PATH: ${{ inputs.test-path }}
        TEST_JULIAUP_CHANNEL: ${{ inputs.juliaup-channel }}
        TEST_ENV: ${{ inputs.env }}
        TEST_FILTER: ${{ inputs.filter }}
        TEST_TIMEOUT: ${{ inputs.testitem-timeout }}
        TEST_PROFILE_NAME: ${{ inputs.profile-name }}
        TEST_COVERAGE: ${{ inputs.coverage }}
        TEST_COVERAGE_LCOV: ${{ inputs.coverage-lcov-path }}
        TEST_JUNIT_PATH: ${{ inputs.junit-path }}
        TEST_OUTPUT_MODE: ${{ inputs.output-mode }}
        TEST_MAX_WORKERS: ${{ inputs.max-workers }}
        TEST_THREADS: ${{ inputs.threads }}
        TEST_GC_BETWEEN: ${{ inputs.gc-between-testitems }}
        TEST_MEMORY_THRESHOLD: ${{ inputs.memory-threshold }}
        TEST_SCHEDULE: ${{ inputs.schedule }}
        TEST_LOG_LEVEL: ${{ inputs.test-log-level }}
        TEST_CHECK_BOUNDS: ${{ inputs.check-bounds }}
        RESULTS_PATH: ${{ inputs.results-path }}
        ANNOTATIONS: ${{ inputs.annotations }}
    - name: Emit failure annotations
      if: inputs.annotations == 'true'
      shell: bash
      run: node "$GITHUB_ACTION_PATH/scripts/annotations.js" "$RESULTS_FILE"
      env:
        RESULTS_FILE: ${{ steps.run.outputs.results-path }}
    - name: Fail if tests failed
      shell: bash
      # An empty exit code means the run step never reported one — fail, don't pass.
      run: exit ${CODE:-1}
      env:
        CODE: ${{ steps.run.outputs.exit-code }}
